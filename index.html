<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKS Tracker | Dark Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <style>
        :root {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        body { 
            background-color: #0f172a; 
            color: #f1f5f9;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Particle Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .filter-btn {
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        input:focus {
            border-color: var(--accent) !important;
            ring: 2px var(--accent-glow);
        }

        /* Webkit scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center">

    <canvas id="bg-canvas"></canvas>

    <div class="glass-card p-6 w-full max-w-3xl mb-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-blue-500"></div>
        
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 rounded-lg">
                    <i data-lucide="zap" class="text-blue-400"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                    ALEKS Tracker
                </h1>
            </div>
            <span class="text-xs font-mono text-blue-400 bg-blue-400/10 px-2 py-1 rounded">V2.0 STABLE</span>
        </div>
        
        <div class="flex flex-wrap gap-4 mb-8">
            <div class="flex flex-col gap-1 flex-1 min-w-[150px]">
                <label class="text-xs uppercase tracking-widest text-gray-500 font-bold ml-1">Date</label>
                <input type="date" id="dateInput" class="p-3 rounded-xl outline-none">
            </div>
            <div class="flex flex-col gap-1 w-32">
                <label class="text-xs uppercase tracking-widest text-gray-500 font-bold ml-1">Minutes</label>
                <input type="number" id="timeInput" placeholder="0" class="p-3 rounded-xl outline-none">
            </div>
            <div class="flex items-end">
                <button onclick="addData()" class="btn-gradient text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> ADD
                </button>
            </div>
        </div>

        <div class="flex gap-2 justify-center border-t border-white/5 pt-6">
            <button onclick="updateChart(7)" class="filter-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-sm font-medium">Week</button>
            <button onclick="updateChart(14)" class="filter-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-sm font-medium">2 Weeks</button>
            <button onclick="updateChart(30)" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Month</button>
            <button onclick="updateChart(365)" class="filter-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-sm font-medium">Year</button>
            <button onclick="clearData()" class="ml-auto text-gray-500 hover:text-red-400 transition-colors">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div class="glass-card p-6 w-full max-w-3xl h-[450px]">
        <canvas id="aleksChart"></canvas>
    </div>

    <script>
        /** BACKGROUND ANIMATION **/
        const canvas = document.getElementById('bg-canvas');
        const bgCtx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = 'rgba(59, 130, 246, 0.5)';
                bgCtx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) particles.push(new Particle());
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        bgCtx.beginPath();
                        bgCtx.strokeStyle = `rgba(59, 130, 246, ${1 - dist / 120})`;
                        bgCtx.lineWidth = 0.5;
                        bgCtx.moveTo(p.x, p.y);
                        bgCtx.lineTo(p2.x, p2.y);
                        bgCtx.stroke();
                    }
                }
            });
            requestAnimationFrame(animateBg);
        }
        initParticles();
        animateBg();

        /** TRACKER LOGIC **/
        let myChart = null;
        lucide.createIcons();
        document.getElementById('dateInput').valueAsDate = new Date();

        function getStoredData() {
            const data = localStorage.getItem('aleks_logs');
            return data ? JSON.parse(data) : [];
        }

        function addData() {
            const date = document.getElementById('dateInput').value;
            const time = parseInt(document.getElementById('timeInput').value);
            if (!date || isNaN(time)) return;

            const logs = getStoredData();
            logs.push({ x: date, y: time });
            logs.sort((a, b) => new Date(a.x) - new Date(b.x));
            localStorage.setItem('aleks_logs', JSON.stringify(logs));
            document.getElementById('timeInput').value = '';
            updateChart();
        }

        function clearData() {
            if (confirm("Reset all tracking data?")) {
                localStorage.removeItem('aleks_logs');
                updateChart();
            }
        }

        function updateChart(days = 30) {
            const rawData = getStoredData();
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            const filteredData = rawData.filter(d => new Date(d.x) >= cutoff);

            // UI Button state
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-white/5');
                if (btn.innerText.toLowerCase().includes(days === 7 ? 'week' : days === 30 ? 'month' : days === 365 ? 'year' : '2 weeks')) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-white/5');
                }
            });

            if (myChart) myChart.destroy();
            const ctx = document.getElementById('aleksChart').getContext('2d');
            
            // Create neon gradient for the line
            const chartGrad = ctx.createLinearGradient(0, 0, 0, 400);
            chartGrad.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
            chartGrad.addColorStop(1, 'rgba(59, 130, 246, 0)');

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Minutes',
                        data: filteredData,
                        borderColor: '#3b82f6',
                        backgroundColor: chartGrad,
                        borderWidth: 4,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#3b82f6',
                        pointRadius: 4,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { 
                            type: 'time', 
                            time: { unit: 'day' },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#64748b' }
                        },
                        y: { 
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#64748b' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#fff',
                            bodyColor: '#3b82f6',
                            padding: 12,
                            displayColors: false
                        }
                    }
                }
            });
        }
        updateChart();
    </script>
</body>
</html>
